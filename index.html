<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Power Rankings — RPL</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--red:#ff1233;--bg:#0f0f1a;--tx:#f2f2fa;--tx2:#b4b4d0;--mu:#5c5c7a;--gr:#18d464;--lose:#f06070;--bl:#5b9cf6;
--gb:rgba(26,26,44,.58);--gl:rgba(255,255,255,.12);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{margin:0;padding:0;box-sizing:inherit}
body{background:radial-gradient(900px 520px at 80% -10%,rgba(255,18,51,.16),transparent 60%),radial-gradient(800px 500px at 0 100%,rgba(91,156,246,.07),transparent 55%),var(--bg);color:var(--tx);font:14px 'Inter',sans-serif;min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased}
body::before{content:'';position:fixed;inset:0;background:repeating-linear-gradient(115deg,transparent 0 46px,rgba(255,255,255,.018) 46px 47px);pointer-events:none}
.wrap{max-width:980px;margin:0 auto;padding:36px 18px 60px;position:relative}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.eyebrow{font:700 10px 'JetBrains Mono',monospace;letter-spacing:.2em;text-transform:uppercase;color:#ff4d5e;margin-bottom:8px;display:flex;gap:9px;align-items:center}
.eyebrow::before{content:'';width:20px;height:2px;background:var(--red)}
h1{font:clamp(52px,12vw,104px)/.85 'Bebas Neue',sans-serif;letter-spacing:.02em;transform:skewX(-6deg)}
h1 em{font-style:normal;color:transparent;-webkit-text-stroke:2px var(--red)}
.tabs{display:flex;gap:6px}
.tabs button{background:var(--gb);border:1px solid var(--gl);color:var(--tx2);font:600 11px 'JetBrains Mono',monospace;letter-spacing:.1em;text-transform:uppercase;padding:9px 16px;border-radius:30px;cursor:pointer}
.tabs button.on{background:var(--red);color:#fff;border-color:rgba(255,255,255,.2);box-shadow:0 6px 24px rgba(255,18,51,.4)}
.rail{display:flex;overflow-x:auto;padding:14px 0 18px;position:relative;margin-bottom:10px}
.rail::before{content:'';position:absolute;left:0;right:0;top:21px;height:1px;background:var(--gl)}
.rail button{flex:none;background:none;border:0;cursor:pointer;color:var(--mu);font:500 10.5px 'JetBrains Mono',monospace;padding:0 11px;display:flex;flex-direction:column;align-items:center;gap:9px;position:relative}
.rail button::before{content:'';width:15px;height:15px;border-radius:50%;background:var(--bg);border:2px solid var(--mu);transition:.2s}
.rail button:hover{color:#fff}.rail button:hover::before{border-color:#fff}
.rail button.on{color:#fff}.rail button.on::before{background:var(--red);border-color:var(--red);box-shadow:0 0 0 5px rgba(255,18,51,.2),0 0 20px var(--red)}
.bar{display:flex;justify-content:space-between;align-items:center;margin:6px 0 14px}
.bar h2{font:34px 'Bebas Neue',sans-serif;letter-spacing:.05em}
.date{font:11px 'JetBrains Mono',monospace;color:var(--tx2);margin-left:10px}
.nav button{background:var(--gb);border:1px solid var(--gl);color:var(--tx);width:38px;height:38px;border-radius:10px;cursor:pointer;font-size:15px;margin-left:6px}
.nav button:hover{background:var(--red)}
.lg{width:var(--z);height:var(--z);position:relative;flex:none;display:grid;place-items:center}
.lg img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 6px 18px rgba(0,0,0,.55))}
.lg span{display:none;width:100%;height:100%;place-items:center;border-radius:22%;background:rgba(255,18,51,.1);border:1px solid rgba(255,18,51,.3);font:600 calc(var(--z)*.28) 'JetBrains Mono',monospace}
.lg.nl span{display:grid}
.mv{font:600 11px 'JetBrains Mono',monospace;padding:4px 9px;border-radius:20px;background:rgba(255,255,255,.07);white-space:nowrap}
.up{color:var(--gr);background:rgba(24,212,100,.1)}.dn{color:var(--lose);background:rgba(240,96,112,.1)}.nw{color:var(--bl);background:rgba(91,156,246,.1)}.eq{color:var(--mu)}
.num{font:900 1em 'Bebas Neue',sans-serif;color:transparent;-webkit-text-stroke:1px rgba(255,255,255,.28);line-height:.8}
.card{background:var(--gb);border:1px solid var(--gl);border-radius:16px;position:relative;overflow:hidden;cursor:pointer;backdrop-filter:blur(14px);animation:up .5s cubic-bezier(.16,.84,.44,1) both;animation-delay:var(--d,0s);transition:border-color .2s,transform .2s}
.card:hover{border-color:rgba(255,18,51,.5);transform:translateY(-2px)}
.card.sel{border-color:var(--red);box-shadow:0 0 0 1px var(--red),0 16px 50px rgba(255,18,51,.18)}
@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.spot{display:flex;align-items:center;gap:30px;padding:30px 34px;min-height:230px;background:linear-gradient(120deg,rgba(255,18,51,.2),rgba(26,26,44,.6) 55%)}
.spot .num{position:absolute;right:14px;bottom:-24px;font-size:270px;-webkit-text-stroke:2px rgba(255,18,51,.45)}
.spot .tag{font:700 10px 'JetBrains Mono',monospace;letter-spacing:.2em;color:#ff4d5e;margin-bottom:8px}
.spot h3{font:clamp(38px,8vw,76px)/.9 'Bebas Neue',sans-serif;letter-spacing:.03em;margin-bottom:14px}
.meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font:12px 'JetBrains Mono',monospace;color:var(--tx2)}
.pod{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}
.pod .card{display:flex;align-items:center;gap:16px;padding:20px 22px}
.pod .num{position:absolute;right:12px;top:8px;font-size:86px}
.pod h4{font:26px/1 'Bebas Neue',sans-serif;letter-spacing:.04em;margin-bottom:8px}
.list{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.list .card{display:flex;align-items:center;gap:13px;padding:12px 16px}
.list .num{font-size:44px;width:44px}
.list h5{flex:1;font:600 14px 'Inter',sans-serif;min-width:0}
.trk{margin-top:12px;padding:20px 22px;cursor:default;animation-delay:.3s}
.trk:hover{transform:none;border-color:var(--gl)}
.trk h3,.sts h3{font:700 10px 'JetBrains Mono',monospace;letter-spacing:.16em;text-transform:uppercase;color:#ff4d5e;margin-bottom:6px}
.trk .tn{font:30px 'Bebas Neue',sans-serif;letter-spacing:.04em;margin-bottom:8px}
svg{display:block;width:100%;height:auto;overflow:visible}
svg text{font:9px 'JetBrains Mono',monospace;fill:var(--mu)}
svg circle{cursor:pointer}
.sts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.sts .card{padding:18px 22px;cursor:default}.sts .card:hover{transform:none;border-color:var(--gl)}
.st{display:flex;justify-content:space-between;padding:6px 0;font-size:13px;border-bottom:1px solid rgba(255,255,255,.06)}
.st:last-child{border:0}.st b{font:500 12px 'JetBrains Mono',monospace;color:var(--tx2)}
@media(max-width:700px){.spot{flex-direction:column;align-items:flex-start;padding:24px 22px;gap:16px}.spot .num{font-size:180px}.pod,.list,.sts{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div class="wrap">
<div class="top"><div><div class="eyebrow">Revolutionary Pro League</div><h1>Power<br><em>Rankings</em></h1></div>
<div class="tabs"><button class="on" data-t="teams">Teams</button><button data-t="players">Players</button></div></div>
<div class="rail" id="rail"></div>
<div id="app"></div>
<div class="sts" id="sts"></div>
</div>
<script>
const T={HOU:"Houston Rockets",DEN:"Denver Nuggets",NYK:"New York Knicks",BOS:"Boston Celtics",SAS:"San Antonio Spurs",BKN:"Brooklyn Nets",CLE:"Cleveland Cavaliers",GSW:"Golden State Warriors",LAL:"Los Angeles Lakers",OKC:"Oklahoma City Thunder",DAL:"Dallas Mavericks",IND:"Indiana Pacers",PHI:"Philadelphia 76ers",ATL:"Atlanta Hawks",MIN:"Minnesota Timberwolves",CHA:"Charlotte Hornets",UTA:"Utah Jazz",MIA:"Miami Heat",CHI:"Chicago Bulls",MIL:"Milwaukee Bucks",LAC:"Los Angeles Clippers",NOP:"New Orleans Pelicans",POR:"Portland Trail Blazers",WAS:"Washington Wizards",PHX:"Phoenix Suns",TOR:"Toronto Raptors",ORL:"Orlando Magic"};
const ES={HOU:"hou",DEN:"den",NYK:"ny",BOS:"bos",SAS:"sa",BKN:"bkn",CLE:"cle",GSW:"gs",LAL:"lal",OKC:"okc",DAL:"dal",IND:"ind",PHI:"phi",ATL:"atl",MIN:"min",CHA:"cha",UTA:"utah",MIA:"mia",CHI:"chi",MIL:"mil",LAC:"lac",NOP:"no",POR:"por",WAS:"wsh",PHX:"phx",TOR:"tor",ORL:"orl"};
const R=(l,d,s,r)=>({l,d,t:s.split(" "),r:r&&r.split(" ")});
const D=[
R("S2 Final","9/27/25","CHI GSW UTA BKN LAL LAC DEN MIN TOR BOS"),
R("S3 Final","10/15/25","CLE DAL TOR BOS GSW HOU OKC CHA DEN LAL"),
R("S4 Pre","10/20/25","HOU DEN NYK BOS SAS BKN CLE GSW LAL OKC"),
R("S4 W1","10/23/25","GSW DAL BOS HOU SAS NYK CLE POR IND DEN"),
R("S4 W3","11/1/25","HOU PHI SAS BOS CLE LAL OKC GSW NYK ATL"),
R("S4 W4","11/6/25","HOU BOS SAS OKC IND NYK CHA GSW CLE MIN"),
R("S5 Pre","11/17/25","DEN UTA DAL BKN MIA BOS GSW LAL HOU CHI"),
R("S5 W2","11/29/25","LAL IND SAS MIL BKN BOS DEN LAC GSW DAL"),
R("S5 W3","12/6/25","LAL IND SAS BKN MIL BOS LAC GSW NOP NYK"),
R("S6 W1","12/22/25","MIN BOS LAC DEN LAL CLE DAL OKC BKN IND"),
R("S7 W3","1/21/26","PHI DAL PHX WAS HOU TOR ORL LAC LAL GSW"),
R("S8 Final","3/7/26","DEN OKC NYK BOS ATL CHI DAL ORL HOU PHI"),
R("S9 W1","3/22/26","NYK NOP CHA SAS HOU MIA CLE MIL CHI POR"),
R("S9 W2","3/30/26","NYK MIA CHA HOU SAS DEN DAL GSW CHI MIL"),
R("S10 W1","5/29/26","BOS SAS DEN LAC PHX ATL CHA MIA PHI LAL","7-0 3-0 3-1 5-2 4-3 4-1 2-0 1-0 1-0 1-1"),
R("S11 W2","6/7/26","SAS NYK CHA IND BOS LAC PHI PHX DEN LAL","7-0 9-1 13-2 6-1 7-6 10-5 10-3 11-6 16-10 9-6"),
R("S11 W3","6/11/26","SAS NYK IND PHI CHA GSW LAC PHX DEN MIN","7-0 12-1 6-1 14-3 13-3 14-7 10-5 11-8 18-12 13-11"),
R("S12 W1","7/8/26","HOU SAS CLE ATL TOR POR LAL LAC CHI NYK"),
R("S13 Final","8/22/26","GSW HOU WAS NYK PHI SAS BOS CHA MIN IND"),
R("S14 W1","10/10/26","SAS UTA NOP NYK WAS MIA DEN CLE PHI POR")];
const P=[{l:"S2 Final",d:"9/27/25",t:["North","Drake","Cammm","Mari","ZPud"]},{l:"S3 Final",d:"10/15/25",t:["Drake","Camm","Counted","Tom","Mari","Mack","Chris","Gray","Cal","Durkio"]}];
let tab="teams",i=D.length-1,pi=P.length-1,sel=null;
const $=id=>document.getElementById(id);
const nm=k=>tab==="teams"?T[k]:k;
function logo(k,z){return tab==="teams"?`<div class="lg" style="--z:${z}px"><span>${k}</span><img src="https://a.espncdn.com/i/teamlogos/nba/500/${ES[k]}.png" alt="" onerror="this.parentNode.classList.add('nl');this.remove()"></div>`:`<div class="lg nl" style="--z:${z}px"><span>${k.slice(0,2).toUpperCase()}</span></div>`}
function mv(c,pv,k){if(!pv)return'';const p=pv.indexOf(k);if(p<0)return'<span class="mv nw">NEW</span>';const d=p-c;return d>0?`<span class="mv up">▲ ${d}</span>`:d<0?`<span class="mv dn">▼ ${-d}</span>`:'<span class="mv eq">– HOLD</span>'}
function spark(L,idx,k){const n=L.length,W=800,H=170,x=j=>20+j*(760/Math.max(1,n-1)),y=r=>14+(r-1)*(H-34)/10;
 const rk=L.map(e=>{const p=e.t.indexOf(k);return p<0?11:p+1});
 let g=[1,5,10].map(r=>`<line x1="20" x2="780" y1="${y(r)}" y2="${y(r)}" stroke="rgba(255,255,255,.07)"/><text x="0" y="${y(r)+3}">${r}</text>`).join("");
 g+=`<line x1="20" x2="780" y1="${y(11)}" y2="${y(11)}" stroke="rgba(255,255,255,.07)" stroke-dasharray="3 4"/><text x="0" y="${y(11)+3}">NR</text>`;
 g+=`<polyline fill="none" stroke="#ff1233" stroke-width="2.5" stroke-linejoin="round" points="${rk.map((r,j)=>x(j)+","+y(r)).join(" ")}"/>`;
 g+=rk.map((r,j)=>`<circle data-n="${j}" cx="${x(j)}" cy="${y(r)}" r="${j===idx?8:r>10?3:4.5}" fill="${j===idx?'#ff1233':r>10?'#5c5c7a':'#0f0f1a'}" stroke="#ff1233" stroke-width="2"><title>${L[j].l}: ${r>10?'Unranked':'#'+r}</title></circle>`).join("");
 g+=L.map((e,j)=>n<12||j%2?`<text x="${x(j)}" y="${H+4}" text-anchor="middle">${e.l.replace(' Final','F')}</text>`:'').join("");
 return`<svg viewBox="0 0 ${W} ${H+8}">${g}</svg>`}
function render(){
 const L=tab==="teams"?D:P,idx=tab==="teams"?i:pi,e=L[idx],pv=L[idx-1],pt=pv&&pv.t;
 const k=sel&&L.some(x=>x.t.includes(sel))?sel:e.t[0];
 $("rail").innerHTML=L.map((x,n)=>`<button class="${n===idx?'on':''}" data-n="${n}">${x.l}</button>`).reverse().join("");
 const on=$("rail").querySelector(".on");
 const cls=(q)=>q===k?' sel':'';
 const rec=n=>e.r?`<span>${e.r[n]}</span>`:'';
 const d=n=>`style="--d:${n*.05}s"`;
 let h=`<div class="bar"><div><h2 style="display:inline">${e.l} Rankings</h2><span class="date">${e.d}${pv?' · vs '+pv.l:''}</span></div><div class="nav"><button data-s="1" aria-label="Older">←</button><button data-s="-1" aria-label="Newer">→</button></div></div>`;
 const a=e.t[0];
 h+=`<div class="card spot${cls(a)}" data-k="${a}" ${d(0)}><span class="num">01</span>${logo(a,tab==="teams"?150:110)}<div><div class="tag">RANK #1</div><h3>${nm(a)}</h3><div class="meta">${mv(0,pt,a)}${rec(0)}</div></div></div>`;
 h+=`<div class="pod">`+e.t.slice(1,3).map((q,n)=>`<div class="card${cls(q)}" data-k="${q}" ${d(n+1)}><span class="num">0${n+2}</span>${logo(q,70)}<div><h4>${nm(q)}</h4><div class="meta">${mv(n+1,pt,q)}${rec(n+1)}</div></div></div>`).join("")+`</div>`;
 h+=`<div class="list">`+e.t.slice(3).map((q,n)=>`<div class="card${cls(q)}" data-k="${q}" ${d(n+3)}><span class="num">${n+4<10?'0':''}${n+4}</span>${logo(q,42)}<h5>${nm(q)}</h5>${rec(n+3)}${mv(n+3,pt,q)}</div>`).join("")+`</div>`;
 h+=`<div class="card trk"><h3>Rank history — tap any team above</h3><div class="tn">${nm(k)}</div>${spark(L,idx,k)}</div>`;
 $("app").innerHTML=h;
 if(on)on.scrollIntoView({inline:"center",block:"nearest"});
 if(tab==="teams"){const c={},a2={};D.forEach(x=>{x.t.forEach(q=>a2[q]=(a2[q]||0)+1);c[x.t[0]]=(c[x.t[0]]||0)+1});
  const top=o=>Object.entries(o).sort((x,y)=>y[1]-x[1]).slice(0,6).map(([q,v])=>`<div class="st"><span>${T[q]}</span><b>${v}</b></div>`).join("");
  $("sts").innerHTML=`<div class="card"><h3>Most #1 rankings</h3>${top(c)}</div><div class="card"><h3>Most top-10 appearances</h3>${top(a2)}</div>`}else $("sts").innerHTML="";
}
function go(n){const L=tab==="teams"?D:P;n=Math.max(0,Math.min(L.length-1,n));tab==="teams"?i=n:pi=n;render()}
document.addEventListener("click",ev=>{const t=ev.target.closest("[data-t],[data-n],[data-s],[data-k]");if(!t)return;
 if(t.dataset.t){tab=t.dataset.t;sel=null;document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("on",b===t));render()}
 else if(t.dataset.n!==undefined)go(+t.dataset.n);
 else if(t.dataset.s)go((tab==="teams"?i:pi)-+t.dataset.s);
 else{sel=t.dataset.k;render()}});
document.addEventListener("keydown",ev=>{const c=tab==="teams"?i:pi;if(ev.key==="ArrowLeft")go(c-1);if(ev.key==="ArrowRight")go(c+1)});
render();
</script></body></html>
